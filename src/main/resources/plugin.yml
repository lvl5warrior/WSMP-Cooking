name: WSMP-Cooking
version: '1.0.0'
main: com.warriorssmp.cooking.CookingPlugin
api-version: '1.21'
author: WarriorsSMP
softdepend: [Vault, PlaceholderAPI]

commands:
  cookmenu:
    description: Open the Cooking menu
    aliases: [cooking]
  cooktask:
    description: View your active Cooking contract
  cookleaderboards:
    description: View the Cooking leaderboard
    aliases: [cookleaderboard]
  cookbuffs:
    description: View your active Cooking buffs
  cookshop:
    description: Open the Cooking shop (must be near the Chef)
  cookshopadmin:
    description: Admin editor for the Cooking shop
    permission: cooking.admin
  cookmenuadmin:
    description: Admin view of the Cooking menu / player data
    permission: cooking.admin
  cookeditor:
    description: Admin editor for Cooking tasks and tiers
    permission: cooking.admin
  cookmaster:
    description: Spawn or manage the Chef NPC
    permission: cooking.admin

permissions:
  cooking.admin:
    description: Access to Cooking admin commands
    default: op
  premiumcooking:
    description: Access to Tier 3-7 Cooking content
    default: false
