# Only one Legendary Request in this build — the design doc's Tier 7
# "Commission" is a mixed multi-dish delivery (e.g. 16 Golden Apples + 32
# Cakes + 64 Cooked Mutton at once), which would need a genuine multi-part
# structure to do properly. Simplified here to a single-item bulk request,
# matching the same pattern every other WSMP skill plugin uses for its Tier 7
# capstone, to keep scope consistent across the whole plugin set.
legendary-requests:
  the_commission:
    display: "&b👑 The Commission"
    material: GOLDEN_APPLE
    min-amount: 8
    max-amount: 16
    yield: 600
    cooldown-hours: 12

# Streak pays out sooner and higher than the other skills, per the design
# doc: a cook has to source ingredients first, so the streak is where the
# skill earns its keep. Unit is CONTRACTS COMPLETED, not dishes cooked — if
# it counted raw dishes, +300% would be multiplying something a farm and a
# smoker can bulk-produce in minutes, which would be the fastest way to
# inflate the shared economy.
streak-bonus:
  3: 0.10
  4: 0.20
  5: 0.40
  10: 0.80
  25: 1.30
  50: 2.00
  100: 3.00

