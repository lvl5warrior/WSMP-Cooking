# WSMP-Cooking configuration
# Points are an in-plugin currency earned from tasks and The Commission
# Legendary Request — NOT real money, NOT shared with any other plugin.
# Every number in this file is a placeholder ratio; rebalance to taste.
#
# VANILLA-ONLY: every dish tracked here is a real base-game recipe. No
# invented items, no invented recipes. What escalates with tier is
# ingredient scarcity and volume, not new content — a Tier 1 contract is
# meat you already have, a Tier 6 contract is a large order of dishes whose
# ingredients take real work to source.
#
# GOLD-RECIPE SAFEGUARD: can-double is set false on Golden Carrot, Golden
# Apple, and Glistering Melon Slice. Perfect Dish normally doubles output,
# but doubling those three would duplicate gold ingots/nuggets — a mining
# faucet hiding inside a cooking skill. Never flip can-double to true for a
# recipe containing gold, diamond, or netherite.

